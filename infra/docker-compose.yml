services:
  lab:
    profiles: ["runtime"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    working_dir: /app
    environment:
      QDRANT_HOST: qdrant
      HF_HUB_DISABLE_XET: "1"
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    volumes:
      - ..:/app
      - model_cache:/root/.cache
    depends_on:
      - qdrant
  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  model_cache:
